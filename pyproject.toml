[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppcheck"
version = "0.1.0"
description = "SQL data-quality checks on the Bundesnetzagentur power plant list"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openpyxl"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["ppcheck"]

[tool.setuptools.package-data]
ppcheck = ["checks/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
